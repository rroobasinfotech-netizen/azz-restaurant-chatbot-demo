<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZZ Food House - WhatsApp Demo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="phone">

        <!-- WhatsApp Header -->
        <div class="chat-header">

            <div class="back-btn">‹</div>

            <div class="restaurant-profile">

                <div class="profile-image">🍽️</div>

                <div class="restaurant-info">

                    <div class="restaurant-name">
                        AZZ Food House
                        <span class="verified">✓</span>
                    </div>

                    <div class="online-status">
                        Online
                    </div>

                </div>

            </div>

            <div class="header-actions">
                <span>📹</span>
                <span>📞</span>
                <span>⋮</span>
            </div>

        </div>


        <!-- Chat Area -->
        <div class="chat-area" id="chatArea">

            <div class="date-label">
                TODAY
            </div>


            <!-- Bot Welcome Message -->
            <div class="message-row received">

                <div class="message bot-message">

                    <div>
                        Hello! 👋 Welcome to <strong>AZZ Food House</strong>.
                    </div>

                    <div class="message-space">
                        How can we help you today?
                    </div>

                    <div class="message-time">
                        11:00 AM
                    </div>

                </div>

            </div>


            <!-- Menu Button -->
            <div class="message-row received">

                <div class="message bot-message menu-message">

                    <div>
                        Pick your food from our menu and add your favourites to your cart. 🍽️
                    </div>

                    <!-- ACTIVE VIEW MENU BUTTON -->
                    <button
                        class="chat-button"
                        onclick="showMenu()">
                        🍽️ View Menu
                    </button>

                    <div class="message-time">
                        11:00 AM
                    </div>

                </div>

            </div>

        </div>


        <!-- Message Input -->
        <div class="input-area">

            <button class="emoji-btn">
                😊
            </button>

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message"
            >

            <button class="attach-btn">
                📎
            </button>

            <button class="camera-btn">
                📷
            </button>

            <button
                class="send-btn"
                id="sendButton">
                ➤
            </button>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
